name: Gemini coach offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  coach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r coach/requirements.txt
      - name: Provider, voice, approvals, budget and hosted auth regressions
        run: python -m unittest discover -s tests -p 'test_coach*.py' -v
      - name: Inspect Gemini harness without credentials or a model call
        run: python -m coach.smoke --tools-only
