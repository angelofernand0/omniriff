<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniRiff Devpost Cover</title>
<style>
  @font-face { font-family: 'Silkscreen'; font-weight: 400; src: url('{{FONT_DIR}}/Silkscreen-400.woff2') format('woff2'); }
  @font-face { font-family: 'Silkscreen'; font-weight: 700; src: url('{{FONT_DIR}}/Silkscreen-700.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400 700; src: url('{{FONT_DIR}}/JetBrainsMono.woff2') format('woff2'); }

  :root {
    --bg: #0B0B10;
    --panel: #14131D;
    --pink: #FF5CCB;
    --shade: #D63FA6;
    --rec: #FF5340;
    --warn: #FFB547;
    --ok: #8FE3A6;
    --text: #ECE9F5;
    --muted: #A6A3B6;
    --dim: #4A4858;
    --off: #24232E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1500px; height: 1000px; overflow: hidden; background: var(--bg); }
  body { font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--text); position: relative; }

  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 100;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 4px);
  }

  .outer-border {
    position: absolute; inset: 24px;
    border: 2px solid var(--off);
    pointer-events: none;
  }

  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 1500px;
    height: 1000px;
    padding: 40px;
  }

  .hero-riff {
    width: 250px;
    height: 250px;
    image-rendering: pixelated;
    margin-bottom: 20px;
    filter: drop-shadow(0 12px 28px rgba(255, 92, 203, 0.25));
  }

  .hero-riff svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .wordmark-wrap {
    width: 760px;
    height: 110px;
    margin-bottom: 16px;
  }

  .wordmark-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .tagline {
    font-family: 'Silkscreen', monospace;
    font-size: 46px;
    font-weight: 700;
    color: var(--pink);
    letter-spacing: 0.04em;
    text-shadow: 0 0 24px rgba(255, 92, 203, 0.4);
    margin-bottom: 12px;
  }

  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    color: var(--muted);
    font-weight: 400;
    margin-bottom: 44px;
    letter-spacing: -0.01em;
  }

  /* Waveform Hook Container */
  .wave-card {
    width: 960px;
    height: 160px;
    background: var(--panel);
    border: 3px solid var(--dim);
    border-radius: 4px;
    position: relative;
    padding: 18px 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
  }

  .wave-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Silkscreen', monospace;
    font-size: 15px;
    color: var(--muted);
  }

  .wave-head .active-tag {
    color: var(--ok);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .wave-head .active-tag::before {
    content: '';
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
  }

  .wave-bars {
    position: relative;
    width: 100%;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .bar {
    width: 10px;
    background: var(--pink);
    border-radius: 1px;
    transition: height 0.2s;
  }

  /* Gap Marker Slam */
  .gap-box {
    position: absolute;
    left: 450px;
    width: 110px;
    top: -4px;
    bottom: -4px;
    border: 4px solid var(--rec);
    box-shadow: 0 0 30px rgba(255, 83, 64, 0.45);
    background: rgba(255, 83, 64, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  .gap-tag {
    font-family: 'Silkscreen', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--rec);
    background: var(--bg);
    padding: 2px 10px;
    border: 2px solid var(--rec);
    transform: translateY(-50%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.8);
    letter-spacing: 0.05em;
  }

  .badge-row {
    position: absolute;
    bottom: 34px;
    display: flex;
    gap: 16px;
  }

  .badge {
    font-family: 'Silkscreen', monospace;
    font-size: 14px;
    color: var(--muted);
    border: 1px solid var(--off);
    padding: 6px 14px;
    background: #0E0D14;
  }
</style>
</head>
<body>

<div class="content">
  <div class="hero-riff">{{MARK_SVG}}</div>
  <div class="wordmark-wrap">{{WORDMARK_SVG}}</div>
  <div class="tagline">NEVER PUT THE GUITAR DOWN</div>
  <div class="subtitle">a guitar teacher that lives in your signal chain</div>

  <div class="wave-card">
    <div class="wave-head">
      <span class="active-tag">SIGNAL CHAIN LIVE</span>
      <span>EARS & EYES DIAGNOSIS</span>
    </div>
    <div class="wave-bars" id="waveBars">
      <!-- Waveform bars generated by script -->
      <div class="gap-box">
        <span class="gap-tag">GAP</span>
      </div>
    </div>
  </div>

  <div class="badge-row">
    <span class="badge">REAL-TIME DSP ENGINE</span>
    <span class="badge">HAND GESTURE TRACKING</span>
    <span class="badge">CYBER-PHYSICAL TEACHER</span>
  </div>
</div>

<div class="outer-border"></div>
<div class="grain"></div>

<script>
  // Render waveform bars with authentic height envelope and a visible gap
  const waveBars = document.getElementById('waveBars');
  const count = 52;
  const gapStart = 24, gapEnd = 30;

  for (let i = 0; i < count; i++) {
    const b = document.createElement('div');
    b.className = 'bar';
    if (i >= gapStart && i <= gapEnd) {
      b.style.height = '4px';
      b.style.opacity = '0.2';
    } else {
      // Natural audio envelope
      const env = Math.abs(Math.sin(i * 0.28) * 0.7 + Math.sin(i * 0.73) * 0.3);
      const h = Math.max(12, Math.round(env * 68));
      b.style.height = h + 'px';
      if (i > gapEnd) {
        b.style.background = 'var(--text)';
      }
    }
    waveBars.appendChild(b);
  }
</script>
</body>
</html>
