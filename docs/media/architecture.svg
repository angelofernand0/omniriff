<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48" />
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="15" y="15" width="1170" height="770" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Diagram Title -->
  <g transform="translate(45, 50)">
    <text x="0" y="0" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5">OmniRiff Architecture</text>
    <text x="0" y="20" font-size="12.5" font-weight="500" fill="#64748b">Real-time cyber-physical audio engine, schema-gated control routing, and deep agent practice coach</text>

    <!-- Transports Header Summary -->
    <g transform="translate(740, -10)">
      <rect x="0" y="0" width="80" height="22" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
      <text x="40" y="15" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">UDP 47800</text>

      <rect x="88" y="0" width="75" height="22" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
      <text x="125" y="15" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">WS 47801</text>

      <rect x="171" y="0" width="75" height="22" rx="4" fill="#faf5ff" stroke="#9333ea" stroke-width="1"/>
      <text x="208" y="15" font-size="10" font-weight="700" fill="#7e22ce" text-anchor="middle">WS 47802</text>

      <rect x="254" y="0" width="75" height="22" rx="4" fill="#fdf4ff" stroke="#c026d3" stroke-width="1"/>
      <text x="291" y="15" font-size="10" font-weight="700" fill="#a21caf" text-anchor="middle">WS 47803</text>

      <rect x="337" y="0" width="85" height="22" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
      <text x="379" y="15" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">Serial 115200</text>
    </g>
  </g>

  <!-- ================= ROW 1: REAL-TIME AUDIO PATH ================= -->

  <!-- 1. Guitar -->
  <g transform="translate(45, 95)">
    <rect width="140" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#0f172a">Electric Guitar</text>
    <text x="14" y="46" font-size="11" fill="#475569">Magnetic pickups</text>
  </g>

  <!-- Arrow: Guitar -> Scarlett -->
  <line x1="185" y1="127" x2="265" y2="127" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="225" y="120" font-size="9.5" font-weight="600" fill="#047857" text-anchor="middle">1/4" cable</text>

  <!-- 2. Scarlett Solo -->
  <g transform="translate(265, 95)">
    <rect width="190" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#0f172a">Scarlett Solo</text>
    <text x="14" y="46" font-size="11" fill="#475569">Input 2 (INST) • Direct Mon OFF</text>
  </g>

  <!-- Arrow: Scarlett -> Audio Engine -->
  <line x1="455" y1="127" x2="545" y2="127" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="500" y="120" font-size="9.5" font-weight="600" fill="#047857" text-anchor="middle">WASAPI / duplex</text>

  <!-- 3. Audio Engine -->
  <g transform="translate(545, 85)">
    <rect width="365" height="85" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#047857">Audio Engine (audio/engine.py, audio/dsp.py)</text>
    <text x="16" y="46" font-size="11" fill="#065f46">30s Looper • Biquad Filter (120–18000 Hz) • Freeverb</text>
    <text x="16" y="65" font-size="11" fill="#065f46">PeakLimiter (&lt;0.999 true peak) • 5 ms dry crossfade bypass</text>
  </g>

  <!-- Arrow: Audio Engine -> Speakers -->
  <line x1="910" y1="127" x2="980" y2="127" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="945" y="120" font-size="9.5" font-weight="600" fill="#047857" text-anchor="middle">analog out</text>

  <!-- 4. Speakers / Amp -->
  <g transform="translate(980, 95)">
    <rect width="175" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#0f172a">Speakers / Amp</text>
    <text x="14" y="46" font-size="11" fill="#475569">Processed guitar output</text>
  </g>

  <!-- ================= ROW 2: TAKES & GESTURE PERCEPTION ================= -->

  <!-- 5. Takes (takes/) -->
  <g transform="translate(735, 215)">
    <rect width="215" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="12" y="24" font-size="12.5" font-weight="700" fill="#0f172a">Takes (takes/)</text>
    <text x="12" y="43" font-size="10.5" fill="#475569">audio/takes.py background writer</text>
  </g>

  <!-- Arrow: Audio Engine -> Takes -->
  <line x1="810" y1="170" x2="810" y2="215" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="818" y="196" font-size="9.5" font-weight="600" fill="#047857">saves loop WAV + JSON</text>

  <!-- 6. Webcam -->
  <g transform="translate(45, 235)">
    <rect width="140" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="24" font-size="12.5" font-weight="700" fill="#0f172a">Webcam</text>
    <text x="14" y="43" font-size="10.5" fill="#475569">Frontal hand view</text>
  </g>

  <!-- Arrow: Webcam -> Vision -->
  <line x1="185" y1="264" x2="245" y2="264" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="215" y="256" font-size="9.5" font-weight="600" fill="#0369a1" text-anchor="middle">video</text>

  <!-- 7. Vision (vision/) -->
  <g transform="translate(245, 220)">
    <rect width="245" height="88" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="22" font-size="13" font-weight="700" fill="#0369a1">Vision (vision/)</text>
    <text x="12" y="40" font-size="10.5" fill="#0c4a6e">MediaPipe Hand Landmarker (21 3D points)</text>
    <text x="12" y="56" font-size="10.5" fill="#0c4a6e">Pinch clutch (vision/control.py: hysteresis)</text>
    <text x="12" y="74" font-size="10" font-weight="700" fill="#dc2626">StrumGuard: opt-in (--strum-guard)</text>
  </g>

  <!-- ================= ROW 3: CONTROLS, ROUTER & COACH ================= -->

  <!-- 8. Footswitch -->
  <g transform="translate(45, 360)">
    <rect width="190" height="70" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="12" y="24" font-size="12.5" font-weight="700" fill="#b45309">Arduino Footswitch</text>
    <text x="12" y="43" font-size="10.5" fill="#78350f">firmware/arduino/Footswitch.ino</text>
    <text x="12" y="59" font-size="10" fill="#78350f">Tap: loop • Hold &#8805;0.7s: practice • Press: bypass</text>
  </g>

  <!-- 9. Router (engine/router.py) -->
  <g transform="translate(370, 360)">
    <rect width="260" height="85" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="24" font-size="13.5" font-weight="700" fill="#0369a1">Router (engine/router.py)</text>
    <text x="12" y="44" font-size="10.5" fill="#0c4a6e">JSON-schema gate (protocol/control.schema.json)</text>
    <text x="12" y="60" font-size="10.5" fill="#0c4a6e">Bounds params [0, 1] • Clamps cutoff 120–18000 Hz</text>
    <text x="12" y="76" font-size="10" fill="#0c4a6e">Drops malformed, duplicate, stale events</text>
  </g>

  <!-- Arrow: Footswitch -> Router -->
  <line x1="235" y1="395" x2="370" y2="395" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <text x="302" y="388" font-size="9.5" font-weight="600" fill="#b45309" text-anchor="middle">serial 115200</text>

  <!-- Arrow: Vision -> Router (UDP 47800) -->
  <path d="M 400 308 L 400 360" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="408" y="338" font-size="9.5" font-weight="600" fill="#0369a1">UDP 47800 (20 Hz)</text>

  <!-- Arrow: Router -> Audio Engine Mailbox -->
  <path d="M 590 360 L 590 170" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr)"/>
  <text x="598" y="225" font-size="10" font-weight="700" fill="#0369a1">submit() mailbox</text>

  <!-- 10. Practice Coach (coach/) -->
  <g transform="translate(735, 330)">
    <rect width="420" height="155" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="14" y="24" font-size="14" font-weight="700" fill="#7e22ce">Practice Coach (coach/agent.py)</text>
    <text x="14" y="42" font-size="11" fill="#581c87">LangGraph Deep Agent: claude-sonnet-5-5 • TodoListMiddleware • MemorySaver</text>
    <text x="14" y="60" font-size="10.5" fill="#581c87">• Subagents (Haiku): Ears (tools/ears/analyze.py) &amp; Eyes (vision/eyes.py)</text>
    <text x="14" y="78" font-size="10.5" fill="#581c87">• Filesystem memory: /skills/, /memories/player.md, /journal/</text>
    <text x="14" y="96" font-size="10.5" fill="#581c87">• Budget gate (coach/budget.py): $8.00 ceiling, coach/workspace/usage.jsonl</text>
    <line x1="14" y1="106" x2="406" y2="106" stroke="#e9d5ff" stroke-width="0.8"/>
    <text x="14" y="124" font-size="11" font-weight="700" fill="#be123c">HITL Pedal Approval Gate: interrupt_on: {"rig_control"}</text>
    <text x="14" y="142" font-size="10.5" fill="#be123c">Player MUST tap pedal to approve drill; agent cannot act alone</text>
  </g>

  <!-- Arrow: Takes -> Coach -->
  <line x1="842" y1="273" x2="842" y2="330" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="850" y="306" font-size="9.5" font-weight="600" fill="#047857">reads takes</text>

  <!-- Arrow: Coach -> Router (rig_control) -->
  <path d="M 735 415 L 630 415" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-rose)"/>
  <text x="682" y="408" font-size="9.5" font-weight="700" fill="#be123c" text-anchor="middle">rig_control (needs tap)</text>
  <text x="682" y="430" font-size="9" font-family="monospace" fill="#be123c" text-anchor="middle">UDP 47800 source: coach</text>

  <!-- ================= ROW 4: STATE PUBLISHER & DASHBOARD ================= -->

  <!-- 11. State Publisher (engine/runtime.py) -->
  <g transform="translate(480, 525)">
    <rect width="250" height="60" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="12" y="24" font-size="12.5" font-weight="700" fill="#6d28d9">State Publisher (engine/runtime.py)</text>
    <text x="12" y="43" font-size="10.5" fill="#4c1d95">Runtime.snapshot • protocol/state.schema.json</text>
  </g>

  <!-- Arrow: Audio Engine -> State Publisher -->
  <path d="M 660 170 L 660 525" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <text x="668" y="508" font-size="9.5" font-weight="600" fill="#6d28d9">engine state</text>

  <!-- 12. Dashboard (dashboard/) -->
  <g transform="translate(370, 650)">
    <rect width="470" height="75" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#0f172a">Dashboard (dashboard/)</text>
    <text x="16" y="46" font-size="11" fill="#475569">Plain HTML/JS (app.js, coach.js, riff.js) • Performance UI</text>
    <text x="16" y="63" font-size="10.5" fill="#475569">01 VU/RMS • 02 Looper &amp; Sliders • 03 Hand View • 04 Coach Column &amp; Drills</text>
  </g>

  <!-- Arrow: State Publisher -> Dashboard (WS 47801) -->
  <line x1="605" y1="585" x2="605" y2="650" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <text x="613" y="622" font-size="9.5" font-weight="700" fill="#6d28d9">state WS 47801</text>

  <!-- Arrow: State Publisher -> Coach (WS 47801) -->
  <path d="M 730 555 L 790 555 L 790 485" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <text x="798" y="525" font-size="9.5" font-weight="700" fill="#6d28d9">state WS 47801</text>

  <!-- Arrow: Vision -> Dashboard (WS 47802) -->
  <path d="M 280 308 L 280 690 L 370 690" fill="none" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <text x="288" y="610" font-size="9.5" font-weight="700" fill="#7e22ce">hand WS 47802</text>

  <!-- Arrow: Coach -> Dashboard (WS 47803) -->
  <path d="M 945 485 L 945 690 L 840 690" fill="none" stroke="#c026d3" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <text x="953" y="610" font-size="9.5" font-weight="700" fill="#a21caf">coach feed WS 47803</text>

  <!-- Footer -->
  <g transform="translate(45, 765)">
    <text x="0" y="0" font-size="11" fill="#64748b">OmniRiff Architecture • Strictly reflects production code on main • 12 functional blocks • HackPrinceton 2026</text>
  </g>
</svg>
